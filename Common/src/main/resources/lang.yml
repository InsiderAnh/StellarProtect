    excludeAdvanced: '&7 me:[type:value] &f- Advanced exclude'
    amount: '&7 b:<min>-<max> &f- Amount range (e.g. b:32-128, b:>=64)'
    enchant: '&7 ench:<name>:<lvl> &f- Enchant filter (e.g. ench:sharpness:5, ench:efficiency)'
    biome: '&7 biome:<name> &f- Biome name'
    tool: '&7 tool:<material> &f- Item in hand'
    lore: '&7 lore:<text|regex:pattern> &f- Lore search'
    display: '&7 display:<text|regex:pattern> &f- Display name search'
    chunkFlag: '&7 #chunk &f- Filter to current chunk only'
    within: '&7 within:<expr> &f- Quick time (e.g. within:30m, within:today)'
    sort: '&7 sort:<field> &f- Sort by (time_desc, time_asc, player_asc)'
    blockOnly: '&7 #blocks &f- Restore only blocks'
    containersOnly: '&7 #containers &f- Restore only container contents'
    itemsOnly: '&7 #items &f- Restore only items (drop/pickup/craft/etc.)'
    killsOnly: '&7 #kills &f- Restore only killed entities'
    regex: '&7 #regex &f- Enable regex matching on display/lore/tool'
    exportCsv: '&7 #export-csv &f- Export result as CSV'
    exportJson: '&7 #export-json &f- Export result as JSON'
    preview: '&7 #preview &f- Preview only, no changes'
    verbose: '&7 #verbose &f- Show verbose output'
    silent: '&7 #silent &f- Suppress chat output'
    session: '&7 #session &f- Interactive session'
    undo: '&7 #undo &f- Undo mode'

