    header: '&eAvailable filters:'
    usage: '&7Usage: &e/spt lookup|restore <filters>'
    time: '&7 t:<duration> &f- Time range (e.g. t:1h, t:1h-2h, t:1d)'
    radius: '&7 r:<radius> &f- Radius (e.g. r:10, r:#world, r:#here:20)'
    location: '&7 l:<world;x;y;z> &f- Exact location'
